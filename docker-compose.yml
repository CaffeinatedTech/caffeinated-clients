services:
  app:
    build: .
    image: ghcr.io/caffeinatedtech/caffeinated-clients:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CCLIENTS_BASE_URL: ${CCLIENTS_BASE_URL:-http://localhost:8080}
      CCLIENTS_DB_KEY: ${CCLIENTS_DB_KEY:?set CCLIENTS_DB_KEY in .env}
      CCLIENTS_TRUST_PROXY: ${CCLIENTS_TRUST_PROXY:-false}
      CCLIENTS_BOOTSTRAP_USERNAME: ${CCLIENTS_BOOTSTRAP_USERNAME:-}
      CCLIENTS_BOOTSTRAP_PASSWORD: ${CCLIENTS_BOOTSTRAP_PASSWORD:-}
    volumes:
      - cclients-data:/data
    healthcheck:
      test: ["CMD", "/caffeinated-clients", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  cclients-data:

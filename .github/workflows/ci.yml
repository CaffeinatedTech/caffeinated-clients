name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: build
        run: CGO_ENABLED=1 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: CGO_ENABLED=1 go test ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cclients:ci
          build-args: VERSION=ci
      - name: Smoke test (serve + healthz on an encrypted database)
        run: |
          key="$(head -c 32 /dev/urandom | base64)"
          docker run -d --name cclients-ci -p 18080:8080 \
            -e CCLIENTS_BASE_URL=http://localhost:18080 \
            -e CCLIENTS_DB_KEY="$key" \
            -e CCLIENTS_BOOTSTRAP_USERNAME=admin \
            -e CCLIENTS_BOOTSTRAP_PASSWORD=long-enough-passphrase \
            cclients:ci
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/healthz || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs cclients-ci
          docker rm -f cclients-ci
          test "$code" = "200"

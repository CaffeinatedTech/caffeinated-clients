name: Docker

# Only the image recipe is exercised here; Go/CGO has its own CI job. This
# builds the image and boots it against a fresh encrypted database so a broken
# Dockerfile is caught on main/PR instead of on a release tag.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cclients:ci
          build-args: VERSION=ci
      - name: Smoke test (serve + healthz on an encrypted database)
        run: |
          key="$(head -c 32 /dev/urandom | base64)"
          docker run -d --name cclients-ci -p 18080:8080 \
            -e CCLIENTS_BASE_URL=http://localhost:18080 \
            -e CCLIENTS_DB_KEY="$key" \
            -e CCLIENTS_BOOTSTRAP_USERNAME=admin \
            -e CCLIENTS_BOOTSTRAP_PASSWORD=long-enough-passphrase \
            cclients:ci
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/healthz || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs cclients-ci
          docker rm -f cclients-ci
          test "$code" = "200"

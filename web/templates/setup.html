<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · caffeinated-clients</title>
</head>
<body>
  <main>
    <h1>Set up two-factor authentication</h1>
    {{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
    <p>Add this account to your authenticator app. You can scan the URI below or enter the key by hand.</p>
    <p><strong>Key:</strong> <code>{{.Secret}}</code></p>
    <p><strong>URI:</strong> <code>{{.OTPAuthURL}}</code></p>
    <p>Then enter the 6-digit code the app shows.</p>
    <form method="post" action="/setup">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <p>
        <label for="code">Code</label>
        <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus>
      </p>
      <button type="submit">Confirm</button>
    </form>
  </main>
</body>
</html>

{{define "content"}}
<article>
  <a href="/clients/{{.Note.ClientID}}?tab=notes" class="text-xs font-medium text-slate-500 hover:underline dark:text-slate-400">&larr; Back to notes</a>
  <h1 class="mt-1 text-2xl font-semibold tracking-tight">{{if .Note.Title}}{{.Note.Title}}{{else}}Secret note{{end}}</h1>
  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Shown for this request only. This reveal was written to the audit log.</p>
  <pre class="mt-4 whitespace-pre-wrap break-words rounded-2xl border border-slate-200 bg-white p-4 font-mono text-sm dark:border-slate-800 dark:bg-slate-900">{{.Note.Body}}</pre>
</article>
{{end}}

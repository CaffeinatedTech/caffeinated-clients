{{define "content"}}
<div class="w-full max-w-md">
  <div class="mb-6 flex flex-col items-center text-center">
    <span class="text-teal-600 dark:text-teal-400">{{template "mark"}}</span>
    <h1 class="mt-3 text-xl font-semibold tracking-tight">Recovery codes</h1>
  </div>
  <div class="rounded-2xl border border-amber-300 bg-amber-50 p-6 shadow-sm dark:border-amber-700 dark:bg-amber-950/40">
    <p role="alert" class="text-sm text-amber-900 dark:text-amber-200">Save these now. Each works once in place of a code from your authenticator app, and they will not be shown again.</p>
    <ul class="mt-4 grid grid-cols-2 gap-2">
      {{range .Codes}}<li class="rounded-lg bg-white px-3 py-2 text-center font-mono text-sm text-slate-800 dark:bg-slate-900 dark:text-slate-100"><code>{{.}}</code></li>{{end}}
    </ul>
  </div>
  <p class="mt-6 text-center">
    <a href="/" class="inline-flex min-h-11 items-center justify-center rounded-lg bg-teal-600 px-5 text-sm font-semibold text-white hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600">Continue to the app</a>
  </p>
</div>
{{end}}

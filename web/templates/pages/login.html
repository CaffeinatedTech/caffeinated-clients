{{define "content"}}
<div class="w-full max-w-sm">
  <div class="mb-6 flex flex-col items-center text-center">
    <span class="text-teal-600 dark:text-teal-400">{{template "mark"}}</span>
    <h1 class="mt-3 text-xl font-semibold tracking-tight">caffeinated-clients</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Sign in to continue</p>
  </div>
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    {{if .Error}}<p role="alert" class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300">{{.Error}}</p>{{end}}

    {{if .HasPasskeys}}
    <button type="button" data-passkey-login
      class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-lg bg-teal-600 px-4 text-sm font-semibold text-white shadow-sm hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.03 5.91M6.75 9a6 6 0 0 0 1.05 3.36M12 12.75a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm6 8.25-2.25-2.25m-7.5 2.25h6M12 12.75v8.25M8.25 3 5.4 5.85A6 6 0 0 0 6.75 15m8.25-11.25L17.85 6.6"/></svg>
      Sign in with a passkey
    </button>
    <p data-passkey-error role="alert" hidden class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300"></p>
    <noscript><p class="mt-3 text-xs text-slate-500 dark:text-slate-400">Passkey sign-in needs JavaScript{{if .PasswordEnabled}}. Use the password form below.{{else}}. Use a recovery code below.{{end}}</p></noscript>
    <form id="passkey-login-form" method="post" action="/login/passkey/finish" hidden>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="credential" value="">
    </form>
    {{if .PasswordEnabled}}
    <div class="my-4 flex items-center gap-3 text-xs uppercase tracking-wide text-slate-400">
      <span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span>or<span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span>
    </div>
    {{end}}
    {{end}}

    {{if .PasswordEnabled}}
    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Username</label>
        <input id="username" name="username" value="{{.Username}}" autocomplete="username" required{{if not .HasPasskeys}} autofocus{{end}}
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-teal-500 focus:outline-none focus:ring-2 focus:ring-teal-500/40 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-teal-500 focus:outline-none focus:ring-2 focus:ring-teal-500/40 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100">
      </div>
      <button type="submit" class="inline-flex min-h-11 w-full items-center justify-center rounded-lg {{if .HasPasskeys}}border border-slate-300 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800{{else}}bg-teal-600 px-4 text-sm font-semibold text-white shadow-sm hover:bg-teal-500{{end}} focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600">Continue</button>
    </form>
    {{end}}

    {{if and .HasPasskeys (not .PasswordEnabled)}}
    <a href="/login/recovery" class="mt-4 inline-flex min-h-11 w-full items-center justify-center rounded-lg border border-slate-300 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Use a recovery code</a>
    {{end}}
  </div>
</div>
{{end}}

{{define "content"}}
<div class="w-full max-w-md">
  <div class="mb-6 flex flex-col items-center text-center">
    <span class="text-teal-600 dark:text-teal-400">{{template "mark"}}</span>
    <h1 class="mt-3 text-xl font-semibold tracking-tight">Set up two-factor authentication</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Scan this code with your authenticator app, or enter the key below, then enter the 6-digit code it shows.</p>
  </div>
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    {{if .Error}}<p role="alert" class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300">{{.Error}}</p>{{end}}
    <img src="{{qr .OTPAuthURL}}" alt="QR code to add this account to your authenticator app" width="224" height="224" class="mx-auto mb-4 rounded-lg border border-slate-200 bg-white p-3 dark:border-slate-800">
    <dl class="space-y-3 text-sm">
      <div>
        <dt class="font-medium text-slate-700 dark:text-slate-300">Setup key</dt>
        <dd class="mt-1 break-all rounded-lg bg-slate-100 px-3 py-2 font-mono text-xs text-slate-800 dark:bg-slate-950 dark:text-slate-200">{{.Secret}}</dd>
      </div>
      <div>
        <dt class="font-medium text-slate-700 dark:text-slate-300">URI</dt>
        <dd class="mt-1 break-all rounded-lg bg-slate-100 px-3 py-2 font-mono text-xs text-slate-800 dark:bg-slate-950 dark:text-slate-200">{{.OTPAuthURL}}</dd>
      </div>
    </dl>
    <form method="post" action="/setup" class="mt-5 space-y-4">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div>
        <label for="code" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Code</label>
        <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-center text-lg tracking-widest text-slate-900 shadow-sm focus:border-teal-500 focus:outline-none focus:ring-2 focus:ring-teal-500/40 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100">
      </div>
      <button type="submit" class="inline-flex min-h-11 w-full items-center justify-center rounded-lg bg-teal-600 px-4 text-sm font-semibold text-white shadow-sm hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600">Confirm</button>
    </form>
  </div>
</div>
{{end}}

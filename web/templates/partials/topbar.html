{{define "topbar"}}
<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
  <div class="mx-auto flex h-14 max-w-3xl items-center justify-between gap-2 px-4">
    <a href="/" class="text-sm font-semibold tracking-tight">{{template "mark"}}<span class="ml-2 align-middle">caffeinated-clients</span></a>
    <div class="flex items-center gap-1">
      <button type="button" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false"
        class="inline-flex h-11 w-11 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100">
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button type="submit" class="inline-flex h-11 items-center rounded-lg px-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">Sign out</button>
      </form>
    </div>
  </div>
</header>{{end}}

{{define "mark"}}<svg class="inline h-5 w-5 align-middle text-teal-600 dark:text-teal-400" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="currentColor"/><g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"><path d="M160 224h176v64a88 88 0 0 1-88 88 88 88 0 0 1-88-88z"/><path d="M336 240h24a48 48 0 0 1 0 96h-24"/><path d="M216 160c0-20 16-28 16-48"/><path d="M280 160c0-20 16-28 16-48"/></g></svg>{{end}}

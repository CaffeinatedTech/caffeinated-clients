{{define "note_reveal"}}
<div id="note-body-{{.Note.ID}}" data-secret-reveal class="mt-2">
  <div data-revealed>
    <pre class="whitespace-pre-wrap break-words rounded-lg bg-slate-100 p-3 font-mono text-sm dark:bg-slate-950">{{.Note.Body}}</pre>
    <div class="mt-2 flex flex-wrap gap-2">
      <button type="button" data-secret-copy class="min-h-9 rounded-lg border border-slate-300 px-3 text-xs font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Copy value</button>
      <button type="button" data-secret-hide class="min-h-9 rounded-lg border border-slate-300 px-3 text-xs font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Hide now</button>
    </div>
    <details data-secret-edit class="mt-3">
      <summary class="cursor-pointer text-xs font-medium text-slate-600 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600 dark:text-slate-300">Edit this secret note</summary>
      <form method="post" action="{{.NotesBase}}/notes/{{.Note.ID}}" hx-post="{{.NotesBase}}/notes/{{.Note.ID}}" hx-target="#notes-panel" hx-swap="outerHTML" class="mt-3 space-y-3">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label class="block"><span class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Title</span>
          <input name="title" value="{{.Note.Title}}" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"></label>
        <label class="block"><span class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Body</span>
          <textarea name="body" rows="4" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-mono text-sm dark:border-slate-700 dark:bg-slate-950">{{.Note.Body}}</textarea></label>
        <div class="flex flex-wrap gap-2">
          <button type="submit" class="inline-flex min-h-11 items-center rounded-lg bg-teal-600 px-4 text-sm font-semibold text-white hover:bg-teal-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600">Save note</button>
          <button type="button" data-secret-cancel class="inline-flex min-h-11 items-center rounded-lg border border-slate-300 px-4 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Cancel</button>
        </div>
      </form>
    </details>
  </div>
  <div data-masked hidden class="flex flex-wrap items-center gap-3">
    <span class="select-none font-mono text-sm tracking-widest text-slate-400 dark:text-slate-500" aria-hidden="true">••••••••</span>
    <form method="post" action="/notes/{{.Note.ID}}/reveal" hx-post="/notes/{{.Note.ID}}/reveal" hx-target="#note-body-{{.Note.ID}}" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit" class="min-h-9 rounded-lg border border-slate-300 px-3 text-xs font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Reveal</button>
    </form>
  </div>
</div>
{{end}}

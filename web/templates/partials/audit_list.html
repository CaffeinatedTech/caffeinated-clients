{{define "audit_list"}}
{{if .Audit}}
<ul class="divide-y divide-slate-200 overflow-hidden rounded-2xl border border-slate-200 bg-white dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900">
  {{range .Audit}}
  <li class="flex items-start justify-between gap-3 px-4 py-3">
    <div class="min-w-0">
      <p class="text-sm font-medium capitalize">{{humanize .Event}}</p>
      <p class="truncate text-xs text-slate-500 dark:text-slate-400">
        {{if .Entity}}{{.Entity}}{{end}}{{if .EntityID}} #{{.EntityID}}{{end}}{{if .IP}} · {{.IP}}{{end}}
      </p>
    </div>
    <time class="shrink-0 text-xs text-slate-400 dark:text-slate-500">{{date .At}}</time>
  </li>
  {{end}}
</ul>
{{else}}
<p class="rounded-2xl border border-dashed border-slate-300 bg-white p-6 text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400">No activity recorded yet.</p>
{{end}}
{{end}}
